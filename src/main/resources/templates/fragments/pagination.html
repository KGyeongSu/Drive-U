<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="list(dataPage, listUrl, detailUrl)">
    <div class="board-list" >
        <div th:if="${dataPage.totalElements == 0}" class="empty-msg" style="padding: 20px; text-align: center; color: #888;">
            등록된 내용이 없습니다.
        </div>

        <a th:each="item : ${dataPage.content}"
           th:href="@{${detailUrl}(id=${item.id})}" class="list-item">

            <span th:if="${item.class.simpleName == 'QuestionListDTO' && item.status != null}"
                  th:class="(${item.status.name() == 'COMPLETED'} ? 'status-completed' : 'status-pending')"
                  th:text="${item.status.description}">
            </span>

            <strong th:text="${item.title}"></strong>

            <div class="meta-info">
                <span th:text="${#temporals.format(item.regDate, 'yyyy-MM-dd')}"></span>
                <span th:if="${item.class.simpleName == 'QuestionListDTO' && item.writerName != null}" th:text="|${#strings.substring(item.writerName, 0, 1)}*${#strings.substring(item.writerName, 2, 3)}|"></span>
            </div>
        </a>
    </div>
    <div th:replace="~{:: pagination(dataPage=${dataPage}, listUrl=${listUrl})}"></div>
</div>

<div th:fragment="adminList(userStatusList, listUrl)">
    <div class="admin-table-card">
        <div class="table-title">
            <h3>사용자 진행 현황</h3>
            <span>최근 접수순</span>
        </div>

        <table class="admin-table">
            <thead>
            <tr>
                <th>회원명</th><th>이메일</th><th>교육</th><th>필기</th><th>기능</th><th>주행</th><th>최근 변경일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${userStatusList}">
                <td th:text="${user.name}">이름</td>
                <td th:text="${user.userEmail}">이메일</td>

                <td>
                    <span class="state" th:text="${user.eduStatus}"
                          th:classappend="${user.eduStatus == '이수' ? 'pass' : (user.eduStatus == '이수예정' ? 'progress' : 'wait')}"></span>
                </td>
                <td>
                    <span class="state" th:text="${user.testStatus}"
                          th:classappend="${user.testStatus == '합격' ? 'pass' : (user.testStatus == '응시예정' ? 'progress' : 'wait')}"></span>
                </td>
                <td>
                    <span class="state" th:text="${user.functionStatus}"
                          th:classappend="${user.functionStatus == '합격' ? 'pass' : (user.functionStatus == '응시예정' ? 'progress' : 'wait')}"></span>
                </td>
                <td>
                    <span class="state" th:text="${user.driveStatus}"
                          th:classappend="${user.driveStatus == '합격' ? 'pass' : (user.driveStatus == '응시예정' ? 'progress' : 'wait')}"></span>
                </td>

                <td th:text="${user.recentDate.year > 2000} ? ${#temporals.format(user.recentDate, 'yyyy-MM-dd')} : '-'">최근변경일</td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{:: pagination(dataPage=${userStatusList}, listUrl=${listUrl})}"></div>
    </div>
</div>

<div th:fragment="pagination(dataPage, listUrl)" class="custom-pagination" id="pagination-container">
    <button class="page-nav-btn"
            th:data-url="${listUrl}"
            th:onclick="loadPage(this.getAttribute('data-url'), 0)"
            th:disabled="${dataPage.first}">&laquo;</button>

    <button class="page-nav-btn"
            th:data-url="${listUrl}"
            th:onclick="loadPage(this.getAttribute('data-url'), [[${dataPage.number - 1}]])"
            th:disabled="${dataPage.first}">이전</button>

    <span th:each="page : ${#numbers.sequence(startPage, endPage)}">
        <button class="page-num-btn"
                th:data-url="${listUrl}"
                th:onclick="loadPage(this.getAttribute('data-url'), [[${page - 1}]])"
                th:text="${page}"
                th:classappend="${page == nowPage ? 'active' : ''}"></button>
    </span>

    <button class="page-nav-btn"
            th:data-url="${listUrl}"
            th:onclick="loadPage(this.getAttribute('data-url'), [[${dataPage.number + 1}]])"
            th:disabled="${dataPage.last}">다음</button>

    <button class="page-nav-btn"
            th:data-url="${listUrl}"
            th:onclick="loadPage(this.getAttribute('data-url'), [[${dataPage.totalPages - 1}]])"
            th:disabled="${dataPage.last}">&raquo;</button>
</div>
</html>
