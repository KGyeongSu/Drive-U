<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('접수완료')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('process')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('process', 'fApply')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 접수완료</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">APPLICATION</p>
                <h1>접수완료</h1>
                <p>시험 접수가 완료되었습니다.</p>
            </div>
        </section>

        <section class="apply-step-wrap"><a class="apply-step done"><span>1</span>
            <p>약관동의</p></a><a class="apply-step done"><span>2</span>
            <p>시험장/날짜선택</p></a><a class="apply-step done"><span>3</span>
            <p>연락처등록</p></a><a class="apply-step done"><span>4</span>
            <p>결제</p></a><a class="apply-step current"><span>5</span>
            <p>접수완료</p></a>
        </section>
        <section class="apply-card">
        <div class="complete-box"><div class="complete-icon">✓</div><h2>시험 접수가 완료되었습니다.</h2><p>접수 내역은 마이페이지에서 확인할 수 있습니다.<br>시험 당일 신분증을 지참하고 시험 시작 30분전까지 시험장에 도착해 주세요.</p></div>
        <div class="apply-info-list" style="margin-top:34px;">
            <div class="apply-info-row"><strong>접수번호</strong><span th:text="${receiptNo}"></span></div>
            <div class="apply-info-row"><strong>시험구분</strong><span>기능시험</span></div>
            <div class="apply-info-row"><strong>시험장</strong><span
                    th:text="|[${applyData.region}] ${applyData.testCenterName}|"></span></div>
            <div class="apply-info-row"><strong>응시일시</strong><span
                    th:text="|${#temporals.format(applyData.examDate, 'yyyy년 MM월 dd일')} ${applyData.examTime}|"></span>
            </div>
            <div class="apply-info-row"><strong>휴대전화번호</strong>
                <span th:text="${appData.contactPhone}"></span>
            </div>
            <div class="apply-info-row"><strong>이메일</strong>
                <span th:text="${appData.contactEmail}"></span>
            </div>
        </div>
        <div class="button-area"><a class="outline-btn sub" th:href="@{/drive-u/process/fApply1}">처음으로</a><a
                class="outline-btn" th:href="@{/drive-u/myPage}">마이페이지</a>
        </div>
    </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
