<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('시험장/날짜 선택')}"></head>
<link rel="stylesheet" th:href="@{/css/process/wApply2.css}">
<body>
<header th:replace="~{fragments/layout :: header('process')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('process', 'wApply')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 시험장/날짜 선택</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">APPLICATION</p>
                <h1>시험장/날짜 선택</h1>
                <p>학과시험 시험장과 날짜를 선택합니다.</p>
            </div>
        </section>

        <section class="apply-step-wrap">
            <a class="apply-step done"><span>1</span><p>약관동의</p></a>
            <a class="apply-step current"><span>2</span><p>시험장/날짜선택</p></a>
            <a class="apply-step "><span>3</span><p>연락처등록</p></a>
            <a class="apply-step "><span>4</span><p>결제</p></a>
            <a class="apply-step "><span>5</span><p>접수완료</p></a>
        </section>

        <form th:action="@{/drive-u/process/wApply2}" method="post" id="applyForm">

            <section class="apply-card">
                <div class="section-head"><h2>시험장/날짜 선택</h2><span>step 02.</span></div>

                <div class="form-grid">
                    <label>응시 종별
                        <select id="licenseSelect" name="licenseType">
                            <option th:each="li : ${licenseTypes}" th:text="${li}"></option>
                        </select>
                    </label>

                    <label>시험 구분<input value="학과시험" readonly></label>

                    <label>지역
                        <select id="regionSelect">
                            <option th:each="region : ${regions}" th:text="${region}"></option>
                        </select>
                    </label>

                    <label>시험장
                        <select id="centerSelect">
                            <option th:each="c : ${centers}"
                                    th:value="${c.testCenterId}"
                                    th:text="${c.centerName}"
                                    th:data-region="${c.region}">
                            </option>
                        </select>
                    </label>
                </div>

                <div class="reservation-area">
                    <div class="calendar-card">
                        <div class="calendar-head">
                            <button type="button" id="prevMonthBtn">‹</button>
                            <strong id="calendarTitle"></strong>
                            <button type="button" id="nextMonthBtn">›</button>
                        </div>
                        <table class="calendar">
                            <thead><tr><th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead>
                            <tbody id="calendarBody"></tbody>
                        </table>
                    </div>
                    <div class="time-list">
                        <button type="button" class="time-item"
                                th:each="time : ${examTimes}"
                                th:data-time="${time}"
                                th:text="${time}">
                        </button>
                    </div>
                </div>

                <input type="hidden" name="examScheduleId" id="examScheduleIdInput">

                <div class="button-area">
                    <a class="outline-btn sub" th:href="@{/drive-u/process/wApply1}">이전</a>
                    <button type="submit" class="outline-btn">다음</button>
                </div>
            </section>

        </form>

    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/process/wApply2.js}"></script>
</body>
</html>
