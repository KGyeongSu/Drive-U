<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('학습영상')}">

</head>
<body>
<header th:replace="~{fragments/layout :: header('edu')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('edu', 'lVideo')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 학습영상</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">LEARNING VIDEO</p>
                <h1>학습영상</h1>
                <p>실제 주행·기능 영상을 활용해 실전 감각을 익힙니다.</p>
            </div>
        </section>
            <section class="content-section">
                <h2 class="section-title">추천 학습영상</h2>

                <div class="video-card-grid"
                     th:if="${videos != null and !videos.isEmpty()}">

                    <article class="learn-video-card"
                             th:each="video : ${videos}">

                        <div class="thumb video-thumb">
                            <img th:if="${video.thumbnailUrl != null and !video.thumbnailUrl.isEmpty()}"
                                 th:src="${video.thumbnailUrl}"
                                 th:alt="${video.title}">

                            <div class="thumb-placeholder"
                                 th:if="${video.thumbnailUrl == null or video.thumbnailUrl.isEmpty()}">
                                YouTube<br>
                                <span th:text="${video.category}">주행 기본</span>
                            </div>

                            <span class="play-badge">▶</span>
                        </div>

                        <h3 th:text="${video.title}">
                            도로주행 기본 자세
                        </h3>

                        <p th:text="${video.description}">
                            차선 변경, 우회전, 정지선 확인 등 실제 주행 상황을 학습합니다.
                        </p>

                        <a th:href="@{/drive-u/lVideo/{courseId}(courseId=${video.courseId})}"
                           class="outline-btn">
                            영상 보기
                        </a>
                    </article>
                </div>

                <div class="empty-box"
                     th:if="${videos == null or videos.isEmpty()}">
                    <h3>등록된 학습영상이 없습니다.</h3>
                    <p>관리자가 학습영상을 등록하면 이곳에 표시됩니다.</p>
                </div>
            </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
