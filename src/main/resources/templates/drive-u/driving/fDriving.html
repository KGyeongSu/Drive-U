<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('기능 시뮬레이션')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('cbt')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('cbt', 'fDriving')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 모의고사 &gt; 기능 시뮬레이션</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">FUNCTION SIMULATION</p>
                <h1>기능 시뮬레이션</h1>
                <p>장내기능 코스를 Unity 기반으로 연습하고 결과를 확인합니다.</p>
            </div>
        </section>

        <section class="content-section">
            <h2 class="section-title">기능 시뮬레이션 실행</h2>
            <div class="simulator-box">
                <div class="sim-screen">
                    <strong>Drive-Ü 시뮬레이터</strong>
                    <span>직각주차 · 경사로 · 돌발상황</span>

                    <button type="button"
                            class="outline-btn"
                            onclick="openUnity();">
                        시뮬레이터 실행
                    </button>

                    <script>
                        let unityWindow = null;

                        function openUnity() {
                            unityWindow = window.open('/unity/index.html', 'DriveUUnityWindow');
                        }
                    </script>
                </div>
                <div class="sim-result">
                    <h3>실습 결과</h3>

                    <div th:if="${score == null}">
                        <p>아직 실습 결과가 없습니다.</p>
                    </div>

                    <div th:if="${score != null}">

                        <div class="score" th:text="${score} + '점'">82점</div>

                        <p th:if="${pass}"
                           style="color:#2563eb;font-weight:700;font-size:20px;">
                            합격
                        </p>

                        <p th:unless="${pass}"
                           style="color:#ef4444;font-weight:700;font-size:20px;">
                            불합격
                        </p>

                        <div th:if="${!pass and failReason != null and !failReason.isEmpty()}">
                            <p style="font-weight:bold;color:#ef4444;">
                                실격 사유
                            </p>

                            <p th:text="${failReason}">
                                실격 사유
                            </p>
                        </div>

                        <div>
                            <p style="font-weight:bold;">
                                감점 항목
                            </p>

                            <p th:text="${penalties}">
                                감점 없음
                            </p>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
