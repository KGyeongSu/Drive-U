<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('학습영상 상세')}">
    <link rel="stylesheet" th:href="@{/css/driveu-common.css}">
</head>

<body>
<header th:replace="~{fragments/layout :: header('edu')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('edu', 'lVideo')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 학습영상 &gt; 상세</div>

        <section class="lvideo-detail-section">

            <div class="detail-top">
                <a th:href="@{/drive-u/lVideo}" class="back-link">
                    목록으로 돌아가기
                </a>
            </div>

            <!-- 영상 데이터가 있을 때 -->
            <div th:if="${video != null}" class="lvideo-detail-wrap">

                <div class="lvideo-player-box">
                    <iframe
                            th:src="|${video.videoUrl}?controls=1&rel=0&modestbranding=1&cc_load_policy=1|"
                            title="학습영상"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen>
                    </iframe>
                </div>

                <div class="lvideo-detail-title">
                    <h1 th:text="${video.title}">
                        도로주행 기본 자세
                    </h1>
                    <div class="lvideo-detail-desc">
                        <p th:text="${video.description}">
                            차선 변경, 우회전, 정지선 확인 등 실제 주행 상황을 학습합니다.
                        </p>
                    </div>
                </div>



            <!-- 영상 데이터가 없을 때 -->
            <div th:if="${video == null}" class="empty-box">
                <h2>학습영상을 찾을 수 없습니다.</h2>
                <p>삭제되었거나 사용 중지된 영상입니다.</p>

                <a th:href="@{/drive-u/lVideo}" class="back-btn">
                    목록으로 돌아가기
                </a>
            </div>
            </div>
        </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
