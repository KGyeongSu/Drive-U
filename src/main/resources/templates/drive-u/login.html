<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>

<header th:replace="~{fragments/layout :: header('')}"></header>
<link rel="stylesheet" th:href="@{/css/login.css}">

<main class="login-main-container">
    <section class="login-intro-section">
        <span class="eyebrow">DRIVE-Ü LMS</span>
        <h1 class="intro-title">더 안전한 내일을 위한<br>운전면허 교육의 시작</h1>
        <p class="intro-desc">
            Drive-Ü는 체계적인 학습 관리 시스템을 통해<br>
            당신의 면허 취득 여정을 함께합니다.
        </p>
    </section>

    <section class="login-card-section">
        <form th:action="@{/drive-u/login}" method="post">

            <div class="form-group">
                <label>아이디</label>
                <input type="text" name="id" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="pwd" placeholder="비밀번호를 입력하세요" required>
            </div>

            <div th:if="${param.error}" style="color: #dc3545; background-color: #fff5f5; border: 1px solid #ffc9c9; padding: 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 500; margin-bottom: 1.5rem; text-align: center;">
                아이디 또는 비밀번호가 일치하지 않습니다.
            </div>

            <div class="login-btn-group">
                <button type="submit" class="btn-action btn-login">로그인</button>
                <a th:href="@{/login/signUp}" class="btn-action btn-signup">회원가입</a>
            </div>
        </form>

        <div class="social-divider">
            <span>또는 간편 로그인</span>
        </div>

        <div class="social-btn-list">
            <a href="/oauth2/authorization/google" class="social-btn btn-google">
                <div class="social-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                </div>
                <span class="social-text">Google로 시작하기</span>
            </a>
            <a href="/oauth2/authorization/naver" class="social-btn btn-naver">
                <div class="social-icon">
                    <span style="font-weight: 900; font-size: 1rem;">N</span>
                </div>
                <span class="social-text">Naver로 시작하기</span>
            </a>
            <a href="/oauth2/authorization/kakao" class="social-btn btn-kakao">
                <div class="social-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#3c1e1e">
                        <path d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.553 1.706 4.8 4.315 6.077l-1.085 3.993c-.066.24.234.425.432.293l4.757-3.15c.193.02.389.037.59.037 4.97 0 9-3.185 9-7.115S16.97 3 12 3z"/>
                    </svg>
                </div>
                <span class="social-text">Kakao로 시작하기</span>
            </a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
