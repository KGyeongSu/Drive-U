<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}">
</head>
<body>

<header th:replace="~{fragments/layout :: header('')}"></header>
<link rel="stylesheet" th:href="@{/css/Login.css}">

<main class="login-main-container">
    <section class="login-intro-section">
        <span class="eyebrow">JOIN DRIVE-Ü</span>
        <h1 class="intro-title">안전 운전의 첫걸음,<br>지금 시작해보세요</h1>
        <p class="intro-desc">
            Drive-Ü의 회원이 되시면 스마트한 학습 관리와<br>
            다양한 모의고사 서비스를 무료로 이용하실 수 있습니다.
        </p>
    </section>

    <section class="login-card-section">
        <form th:action="@{/login/signUp}" method="post">
            <input type="hidden" name="socialKey" th:value="${socialUser?.socialKey}">
            <input type="hidden" name="provider" th:value="${socialUser?.socialProvider}">

            <div th:if="${socialUser != null}" class="form-group" style="text-align: center; margin-bottom: 20px;">
                <p style="color: #4A90E2; font-weight: bold; font-size: 1.1rem;">
                    <span th:text="${#strings.toUpperCase(socialUser.socialProvider)}">소셜</span> 계정으로 연동 가입 중입니다.
                </p>
            </div>

            <div class="form-group">
                <label>이름</label>
                <input type="text" name="name"
                       th:value="${socialUser != null ? socialUser.name : ''}"
                       placeholder="실명을 입력하세요" required>
            </div>

            <div th:if="${socialUser == null}">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" name="id" placeholder="아이디를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" name="pwd" placeholder="비밀번호를 입력하세요" required>
                </div>
            </div>

            <div class="form-group">
                <label>전화번호</label>
                <input type="text"
                       name="phone"
                       th:value="${socialUser != null ? socialUser.phone : ''}"
                       placeholder="010-0000-0000"
                       required>
            </div>
            <div class="form-group">
                <label>이메일</label>
                <input type="email" name="email"
                       th:value="${socialUser != null ? socialUser.email : ''}"
                       placeholder="example@driveu.com" required>
            </div>

            <div class="login-btn-group">
                <button type="submit" class="btn-action btn-login">가입하기</button>
                <a th:href="@{/drive-u/login}" class="btn-action btn-signup">취소</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
