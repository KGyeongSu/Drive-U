<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공지사항')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('userInfo')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('userInfo', 'noticeHome')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 공지사항</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">NOTICE</p>
                <h1>공지사항</h1>
                <p>서비스 운영 공지와 시험 관련 안내사항을 확인합니다.</p>
            </div>
        </section>

        <section class="content-section">
            <div class="section-header">
                <h2 class="section-title">최근 공지</h2>
                <a href="/drive-u/userInfo/noticeHome/registerForm"
                   th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                   class="outline-btn">공지등록</a>
            </div>

            <div id="ajax-update-area">
                <div th:replace="~{fragments/pagination :: list(
                        dataPage=${dataPage},
                        listUrl='/drive-u/userInfo/noticeHome/listFragment',
                        detailUrl='/drive-u/userInfo/noticeHome/noticeDetail'
                     )}"></div>
            </div>
        </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/pagination.js}"></script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
