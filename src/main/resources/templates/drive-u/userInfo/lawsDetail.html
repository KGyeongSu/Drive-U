<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('법규 상세')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('userInfo')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('userInfo', 'lawsHome')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 법규 및 안내</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow" th:text="${lawsDetail == null ? 'LAWS REGISTER' : 'LAWS DETAIL'}"></p>
                <h1 th:text="${lawsDetail == null ? '법규 작성' : '법규 상세 보기'}"></h1>
            </div>
        </section>

        <section class="content-section">
            <h2 class="section-title" th:text="${lawsDetail == null ? '법규 작성' : '법규 상세'}"></h2>

            <form id="lawsForm"
                  th:action="${lawsDetail == null ? '/drive-u/userInfo/lawsHome/lawsRegister' : '/drive-u/userInfo/lawsHome/lawsModify'}"
                  method="post" enctype="multipart/form-data" class="form-box" onsubmit="return validateAndSubmit('lawsForm', lawsFileListArray, lawsDeleteIdsArray)">

                <input type="hidden" name="id" th:if="${lawsDetail != null}" th:value="${lawsDetail.id}">

                <div class="form-grid">
                    <label class="full">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span>법규 제목</span>

                            <div th:if="${lawsDetail != null and lawsDetail.files != null and !lawsDetail.files.isEmpty() and !#authorization.expression('hasRole(''ADMIN'')')}" style="display: flex; gap: 10px;">
                                <a th:each="file : ${lawsDetail.files}"
                                   th:href="@{${file.fileUrl}}"
                                   th:text="' 📄 ' + ${file.fileName}"
                                   style="font-size: 0.85em; color: #007bff; text-decoration: none; border: 1px solid #007bff; padding: 4px 8px; border-radius: 4px;"
                                   onmouseover="this.style.backgroundColor='#e7f1ff'"
                                   onmouseout="this.style.backgroundColor='transparent'">
                                </a>
                            </div>
                        </div>

                        <input id="title" name="title"
                               th:value="${lawsDetail != null ? lawsDetail.title : ''}"
                               placeholder="법규 제목을 입력하세요"
                               th:readonly="${!#authorization.expression('hasRole(''ADMIN'')')}">
                    </label>

                    <label class="full" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                        <span th:text="${lawsDetail == null ? '파일 등록' : '파일 수정 (기존 파일 교체)'}"></span>
                        <label for="fileInput" style="cursor: pointer; display: block; width: 100%;">
                            <div id="fileList" style="margin-top: 10px; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; background: #f9f9f9; min-height: 40px;">
                                <span style="color: #999; font-size: 0.9em;">파일을 클릭하여 선택하세요</span>
                            </div>
                        </label>
                        <input type="file" name="files" id="fileInput" multiple accept=".pdf,.doc,.docx,.hwp"
                               style="display: none;" onchange="handleFileChange(this, lawsFileListArray, renderLawsList)">
                        <small style="color: gray;">* 최대 3개까지 업로드 가능합니다.</small>
                    </label>

                    <label class="full">
                        내용
                        <textarea id="content" name="content"
                                  th:placeholder="${lawsDetail == null} ? '법규 내용을 입력하세요' : ''"
                                  th:text="${lawsDetail != null ? lawsDetail.content : ''}"
                                  th:readonly="${!#authorization.expression('hasRole(''ADMIN'')')}"></textarea>
                    </label>
                </div>

                <div class="button-area">
                    <button th:if="${#authorization.expression('hasRole(''ADMIN'')') and lawsDetail == null}"
                            type="submit" class="outline-btn">법규 등록</button>

                    <th:block th:if="${#authorization.expression('hasRole(''ADMIN'')') and lawsDetail != null}">
                        <button type="submit" id="modifyBtn" class="outline-btn">법규 수정</button>
                        <button type="button" class="outline-btn" onclick="confirmDelete('/drive-u/userInfo/lawsHome/lawsDelete', 'lawsForm')">법규 삭제</button>
                    </th:block>

                    <a href="/drive-u/userInfo/lawsHome" class="outline-btn">목록으로</a>
                </div>
            </form>
        </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/pagination.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const filesFromThymeleaf = /*[[${lawsDetail != null ? lawsDetail.files : '[]'}]]*/ [];
    /*]]>*/
</script>

<script>
    // 이 페이지 전용 데이터
    let lawsFileListArray = [];
    let lawsDeleteIdsArray = [];

    // 공용 렌더링에 내 배열을 호출하는 내 전용 함수
    function renderLawsList(list) {

        const currentList = list || lawsFileListArray;
        renderFileList(currentList);

    }

    // X 버튼 누를 때 실행되는 전용 함수
    function handleRemove(event, index) {

        removeFile(event, index, lawsFileListArray, lawsDeleteIdsArray, renderLawsList);

    }

    // DOM 로드 완료 시 초기화 및 파일 복원 실행
    document.addEventListener("DOMContentLoaded", function () {

        // 기존 파일 있으면 복원하고 renderLawList 호출
        loadExistingFiles(lawsFileListArray, renderLawsList);

        // 수정 모드일 때 실시간 변경 감지 리스너 초기화
        initModifyCheck(renderLawsList, lawsFileListArray);

    });
</script>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
