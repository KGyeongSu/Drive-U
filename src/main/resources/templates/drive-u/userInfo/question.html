<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('문의사항')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('userInfo')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('userInfo', 'questionHome')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 문의사항</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow" th:text="${questionDetail == null ? 'INQUIRY REGISTER' : 'INQUIRY DETAIL'}"></p>
                <h1 th:text="${questionDetail == null ? '문의 작성' : '문의 상세 보기'}"></h1>
            </div>
        </section>

        <section class="content-section">
            <h2 class="section-title" th:text="${questionDetail == null ? '문의 작성' : '문의 내용'}"></h2>

            <form id="questionForm" th:action="${questionDetail == null ? '/drive-u/userInfo/questionRegister' : '/drive-u/userInfo/questionModifyRegister'}"
                  method="post" class="form-box" onsubmit="return validateForm()">

                <input type="hidden" name="id" th:if="${questionDetail != null}" th:value="${questionDetail.id}">

                <div class="form-grid">
                    <label class="full">
                        제목
                        <input id="title" name="title"
                               th:value="${questionDetail != null ? questionDetail.title : ''}"
                               placeholder="문의 제목을 입력하세요"
                               th:readonly="${questionDetail != null and
                             (#authorization.expression('hasRole(''ADMIN'')') or
                             (questionDetail.answer != null) or
                             (questionDetail.writerEmail != #authentication.principal.email))}">
                    </label>
                    <label class="full">
                        내용
                        <textarea id="content" name="content"
                                  placeholder="문의 내용을 입력하세요"
                                  th:text="${questionDetail != null ? questionDetail.content : ''}"
                                  th:readonly="${questionDetail != null and
                                (#authorization.expression('hasRole(''ADMIN'')') or
                                (questionDetail.answer != null) or
                                (questionDetail.writerEmail != #authentication.principal.email))}"></textarea>
                    </label>
                </div>

                <div class="form-grid" th:if="${questionDetail != null}">
                    <label class="full" style="margin-top: 20px;">
                        관리자 답변
                        <textarea name="answer"
                                  th:text="${questionDetail.answer}"
                                  th:readonly="${!#authorization.expression('hasRole(''ADMIN'')')}"
                                  th:placeholder="${#authorization.expression('hasRole(''ADMIN'')')} ? '답변을 입력하세요' : '아직 답변이 등록되지 않았습니다.'"
                                  style="height: 150px; background-color: #f9f9f9;"></textarea>
                    </label>
                </div>

                <div class="button-area">
                    <button th:if="${questionDetail == null}"
                            type="submit"
                            formaction="/drive-u/userInfo/questionRegister"
                            class="outline-btn">문의 등록</button>

                    <button th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                            type="submit"
                            formaction="/drive-u/userInfo/admin/answerRegister"
                            class="outline-btn">답변 등록</button>

                    <th:block th:if="${questionDetail != null and #authorization.expression('!hasRole(''ADMIN'')') and questionDetail.writerEmail == #authentication.principal.email}">

                        <button id="modifyBtn" type="submit"
                                formaction="/drive-u/userInfo/questionModifyRegister"
                                class="outline-btn">문의 수정</button>

                        <button type="button"
                                class="outline-btn"
                                onclick="confirmDelete(this)">문의 삭제</button>
                    </th:block>

                    <a href="/drive-u/userInfo/questionHome" class="outline-btn">목록으로</a>
                </div>
            </form>
        </section>
    </main>

</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/questionHome.js}"></script>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
