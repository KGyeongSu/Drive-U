<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('관리자 대시보드')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">

<header th:replace="~{fragments/admin-layout :: header('admin')}"></header>

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-layout :: adminSide('dashboard')}"></aside>

    <main class="admin-content">
        <section class="admin-hero compact">
            <div>
                <p class="eyebrow">ADMIN DASHBOARD</p>
                <h1>관리자 대시보드</h1>
                <p>사용자 현황과 시험 합격자를 조회하고, 접수·교육 진행 상태를 관리합니다.</p>
            </div>
        </section>

        
<section class="admin-search-card" id="searchArea">
    <div class="section-head">
        <h2>사용자 조회</h2>
        <span>search form</span>
    </div>

    <form action="/drive-u/admin" method="GET" class="admin-search-form">
        <label>검색구분
            <select name="type">
                <option value="">전체</option>
                <option value="NAME" th:selected="${type == 'NAME'}">이름</option>
                <option value="EMAIL" th:selected="${type == 'EMAIL'}">이메일</option>
            </select>
        </label>

        <label class="search-keyword">검색어
            <input type="text" name="keyword" th:value="${keyword}" placeholder="이름 또는 이메일을 입력하세요">
        </label>

        <label>시험구분
            <select name="examType">
                <option value="">전체</option>
                <option value="WRITTEN" th:selected="${examType == 'WRITTEN'}">필기</option>
                <option value="FUNCTION" th:selected="${examType == 'FUNCTION'}">기능</option>
                <option value="DRIVE" th:selected="${examType == 'DRIVE'}">도로주행</option>
            </select>
        </label>

        <label>상태
            <select name="status" id="searchResult">
                <option value="">전체</option>
                <option value="이수" th:selected="${status == '이수'}">교육이수</option>
                <option value="대기" th:selected="${status == '대기'}">대기</option>
                <option value="응시예정" th:selected="${status == '응시예정'}">응시예정</option>
                <option value="합격" th:selected="${status == '합격'}">합격</option>
            </select>
        </label>

        <button type="submit" class="admin-search-btn">조회</button>
    </form>
</section>

<section class="admin-tab-card">
    <div class="admin-tab-head">
        <button type="button" class="admin-tab active" data-target="statusPanel">현황</button>
        <button type="button" class="admin-tab" data-target="passPanel">합격처리</button>
    </div>

    <div class="admin-panel active" id="statusPanel">
        <div class="admin-summary-grid">
            <article>
                <span>전체 회원</span>
                <strong th:text="${meta.totalUser}">0</strong>
                <p th:text="${meta.increaseUser}">0</p>
            </article>
            <article>
                <span>교통안전교육 이수</span>
                <strong th:text="${meta.eduPass}">0</strong>
                <p th:text="${#numbers.formatDecimal(meta.eduPassRate, 1, 1) + '%'}">0%</p>
            </article>
            <article>
                <span>시험 접수</span>
                <strong th:text="${meta.testApply}">0</strong>
                <p>이번 달 기준</p>
            </article>
            <article>
                <span>합격자</span>
                <strong th:text="${meta.passCount}">0</strong>
                <p>필기·기능·주행 합산</p>
            </article>
        </div>

        <div id="ajax-update-area">
            <div th:replace="~{fragments/pagination :: adminList(${userStatusList}, ${listUrl})}"></div>
        </div>
    </div>

    <div class="admin-panel" id="passPanel">

        <!-- 1단계: 시험일정 선택 -->
        <div class="admin-table-card">
            <div class="table-title">
                <h3>합격 처리</h3>
                <span>시험장·시간대를 선택해 응시자를 조회하세요</span>
            </div>

            <div class="pass-filter">
                <label>시험장
                    <select id="passCenter"></select>
                </label>
                <label>시험일
                    <input type="date" id="passDate">
                </label>
                <label>시간대
                    <select id="passTime"></select>
                </label>
                <button type="button" id="loadCandidatesBtn">새로고침</button>
            </div>
        </div>

        <!-- 2단계: 응시자 명단 + 점수 입력 -->
        <div class="admin-table-card">
            <table class="admin-table pass-table">
                <thead>
                <tr>
                    <th>접수번호</th>
                    <th>시험구분</th>
                    <th>면허종별</th>
                    <th>시험장</th>
                    <th>시험일지</th>
                    <th>이름</th>
                    <th>연락처</th>
                    <th>점수</th>
                    <th>처리</th>
                </tr>
                </thead>
                <tbody id="candidateBody">
                <tr><td colspan="9">시험장과 시간대를 선택하세요.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/admin-dashboard.js}"></script>
<script th:src="@{/js/pagination.js}"></script>
</body>
</html>
