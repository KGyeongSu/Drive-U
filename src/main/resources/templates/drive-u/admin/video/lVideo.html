<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('학습 영상 등록')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">

<header th:replace="~{fragments/admin-layout :: header('admin')}"></header>

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-layout :: adminSide('lVideo')}"></aside>

    <main class="admin-content">
        <section class="admin-hero compact">
            <div>
                <p class="eyebrow">LEARNING VIDEO</p>
                <h1>학습 영상 등록</h1>
                <p>기능·도로주행 학습용 영상을 등록하고 노출 순서를 관리합니다.</p>
            </div>
        </section>


        <section class="admin-form-card">
            <div class="section-head">
                <h2>학습 영상 등록</h2>
                <span>기능·주행 학습용</span>
            </div>

            <form class="admin-form-grid"
                  th:action="@{/drive-u/admin/video/lVideo/create}"
                  th:object="${form}"
                  method="post">

                <label>
                    영상 구분
                    <input type="text"
                           th:field="*{category}"
                           placeholder="예: 기능, 도로주행, 안전운전"
                           required>
                </label>

                <label class="full">
                    영상 제목
                    <input type="text"
                           th:field="*{title}"
                           placeholder="예: 도로주행 차선 변경 방법"
                           required>
                </label>

                <label class="full">
                    YouTube URL
                    <input type="text"
                           th:field="*{videoUrl}"
                           placeholder="https://youtu.be/..."
                           required>
                </label>

                <label class="full">
                    영상 설명
                    <textarea th:field="*{description}"
                              placeholder="학습 영상 설명을 입력하세요"
                              required></textarea>
                </label>

                <label>
                    사용 여부
                    <select th:field="*{useYn}">
                        <option value="Y">사용</option>
                        <option value="N">미사용</option>
                    </select>
                </label>
                <div class="button-area full">
                    <button type="submit"
                            class="admin-small-btn">
                        저장
                    </button>

                    <a th:href="@{/drive-u/admin/video/lVideo}"
                       class="admin-small-btn sub">
                        목록
                    </a>
                </div>
            </form>
        </section>

    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/admin/admin-dashboard.js}"></script>
</body>
</html>
