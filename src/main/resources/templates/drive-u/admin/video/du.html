<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('교통안전교육 챕터 관리')}">
</head>
<body>
<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
<header th:replace="~{fragments/admin-layout :: header('admin')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/admin-layout :: adminSide('duVideo')}"></aside>

    <main class="content">
        <div class="breadcrumb">관리자 &gt; 교통안전교육 관리</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">ADMIN SAFETY EDUCATION</p>
                <h1>교통안전교육 챕터 관리</h1>
                <p>교통안전교육 영상과 챕터별 퀴즈를 관리합니다.</p>
            </div>
        </section>

        <section class="content-section">
            <h2 class="section-title">챕터 목록</h2>

            <table class="admin-table">
                <thead>
                <tr>
                    <th>순서</th>
                    <th>챕터명</th>
                    <th>영상 URL</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="chapter : ${chapters}">
                    <td th:text="${chapter.chapterOrder}">1</td>
                    <td th:text="${chapter.chapterTitle}">운전자가 되는 첫걸음</td>
                    <td th:text="${chapter.videoUrl}">영상 URL</td>
                    <td>
                        <a class="outline-btn"
                           th:href="@{/drive-u/admin/video/{chapterId}/replace(chapterId=${chapter.chapterId})}">
                            새 버전 등록
                        </a>
                    </td>
                </tr>
                <tr th:if="${chapters == null or chapters.isEmpty()}">
                    <td colspan="4">등록된 교통안전교육 챕터가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
