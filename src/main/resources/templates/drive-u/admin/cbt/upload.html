<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('CBT 일괄 등록')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">

<header th:replace="~{fragments/admin-layout :: header('admin')}"></header>

<div class="admin-layout">
    <aside th:replace="~{fragments/admin-layout :: adminSide('cbt')}"></aside>

    <main class="admin-content">
        <section class="admin-hero compact">
            <div>
                <p class="eyebrow">CBT MANAGEMENT</p>
                <h1>CBT 일괄 등록</h1>
                <p>CSV 파일을 업로드하여 학과시험 CBT 문제와 보기를 한 번에 등록합니다.</p>
            </div>
        </section>

        <section class="admin-form-card">
            <div class="section-head">
                <h2>파일 업로드</h2>
                <span>데이터 일괄 등록</span>
            </div>

            <div th:if="${param.success}" style="background-color: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #c3e6cb; text-align: center; font-weight: bold;">
                🎉 성공! CSV 파일 업로드가 완료되었습니다.
            </div>

            <form th:action="@{/drive-u/admin/cbt/upload}" method="post" enctype="multipart/form-data" class="admin-form-grid">

                <label class="full">CSV 파일 선택
                    <input type="file" name="file" accept=".csv" required>
                </label>

                <label>소스 이름 (예: 운전면허 1세트)
                    <input type="text" name="sourceName" placeholder="문제 출처를 입력하세요" required>
                </label>

                <label>적용 날짜
                    <input type="date" name="effectiveDate" required>
                </label>

                <div class="button-area">
                    <button type="submit" class="admin-small-btn">업로드 시작</button>
                    <button type="reset" class="admin-small-btn sub">초기화</button>
                </div>
            </form>
        </section>

        <section class="admin-table-card">
            <div class="table-title">
                <h3>등록 가이드</h3>
                <span>CSV 형식 확인</span>
            </div>
            <div style="padding: 20px; font-size: 0.9em; color: #666;">
                <p><strong>CSV 파일 형식 예시:</strong></p>
                <code style="background: #f4f4f4; padding: 5px; display: block;">
                    문제내용,보기1,보기2,보기3,보기4,보기5,정답<br>
                    교차로 진입 전은?,감속한다,가속한다,정지한다,유턴한다,그냥간다,1,3
                </code>
                <p style="margin-top: 10px;">※ 첫 번째 줄은 헤더로 간주하여 건너뜁니다.</p>
            </div>
        </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/admin-dashboard.js}"></script>
</body>
</html>
