<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('필기 CBT')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('cbt')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('cbt', 'cbt')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 필기 CBT</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">CBT MOCK TEST</p>
                <h1>필기 CBT</h1>
                <p>실제 학과시험과 유사한 CBT 방식으로 문제를 풉니다.</p>
            </div>
        </section>

        <section class="content-section">
            <h2 class="section-title">CBT 모의고사</h2>

            <div class="cbt-box">
                <div class="cbt-head">
                    <strong id="questionCounter">문제 0 / 0</strong>
                    <span id="timer">남은 시간 40:00</span>
                </div>

                <div id="loadingBox">
                    문제를 불러오는 중입니다...
                </div>

                <div id="questionBox" style="display:none;">
                    <p class="question" id="questionText"></p>

                    <div id="questionImageBox" style="display:none;">
                        <img id="questionImage" src="" alt="문제 이미지"
                             style="max-width:100%; border-radius:16px; margin:16px 0;">
                    </div>

                    <div class="answer-list" id="answerList"></div>

                    <div class="button-area">
                        <button type="button" class="outline-btn" id="prevBtn">이전 문제</button>
                        <button type="button" class="outline-btn" id="nextBtn">다음 문제</button>
                        <button type="button" class="outline-btn" id="submitBtn">제출하기</button>
                    </div>
                </div>
            </div>
        </section>

    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/cbt.js}"></script>

</body>
</html>
