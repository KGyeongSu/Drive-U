<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('교통안전교육')}">

</head>

<body>
<header th:replace="~{fragments/layout :: header('edu')}"></header>

<div class="layout">
    <aside th:replace="~{fragments/layout :: side('edu', 'du')}"></aside>

    <main class="content">
        <div class="breadcrumb">홈 &gt; 교통안전교육</div>

        <section class="hero-card">
            <div class="hero-text">
                <p class="eyebrow">SAFETY EDUCATION</p>
                <h1>교통안전교육</h1>

                <!-- 현재 선택된 챕터가 있을 때만 표시 -->
                <p class="current-chapter" th:if="${chapter != null}">
                    현재 학습:
                    <strong th:text="|${chapter.chapterOrder}강. ${chapter.chapterTitle}|">
                        1강. 운전자가 되는 첫걸음_운전면허취득
                    </strong>
                </p>
                <!-- 데이터가 아직 없을 때 표시 -->
                <p class="current-chapter" th:if="${chapter == null}">
                    아직 등록된 교통안전교육 챕터가 없습니다.
                </p>
            </div>
        </section>
        <section class="content-section">
            <h2 class="section-title">교통안전교육 진행</h2>

            <div class="video-layout">
                <div class="video-player">

                    <!-- 현재 선택된 챕터가 있을 때: 유튜브 영상 출력 -->
                    <div class="video-screen" th:if="${chapter != null}">
                        <iframe
                                id="duPlayer"
                                th:src="|${chapter.videoUrl}?enablejsapi=1&controls=0&rel=0&modestbranding=1|"
                                title="교통안전교육 영상"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                                allowfullscreen>
                        </iframe>
                    </div>

                    <!-- 현재 선택된 챕터가 없을 때: 안내 화면 출력 -->
                    <div class="video-screen" th:if="${chapter == null}">
                        <span>교통안전교육 영상</span>
                        <small>아직 등록된 교통안전교육 챕터가 없습니다.</small>
                    </div>
                    <div class="fake-progress">
                        <div id="duProgressBar"></div>
                    </div>
                </div>

                <!-- 챕터 목록 -->
                <div class="chapter-panel">
                    <h3>챕터 목록</h3>
                    <a class="chapter"
                       th:each="item : ${chapterMenus}"
                       th:href="@{/drive-u/du/{chapterId}(chapterId=${item.chapterId})}"
                       th:classappend="${chapter != null and item.chapterId == chapter.chapterId} ? ' selected' :
            (${item.accessible} ? '' : ' locked')">

                        <span th:text="|${item.chapterOrder}. ${item.chapterTitle}|">
                                 1. 운전자가 되는 첫걸음
                         </span>

                        <small th:if="${!item.accessible}" class="chapter-status lock">🔒</small>
                    </a>

                </div>

                <!-- 퀴즈 영역 -->
                <div class="quiz-box" id="quizBox" th:data-completed="${duCompleted}">

                    <!-- 현재 챕터 ID -->
                    <input type="hidden"
                           id="currentChapterId"
                           th:value="${chapter != null ? chapter.chapterId : 0}">

                    <!-- 문제 진행 표시 -->
                    <div class="quiz-progress"
                         th:if="${quizzes != null and !quizzes.isEmpty()}">
                        <span id="quizCurrentNo">1</span>
                        /
                        <span id="quizTotalNo"
                              th:text="${quizzes.size()}">3</span>
                    </div>

                    <!-- 문제 목록: 화면에는 JS로 하나씩만 표시 -->
                    <div class="quiz-item"
                         th:each="quiz, quizStat : ${quizzes}"
                         th:data-index="${quizStat.index}"
                         th:style="${quizStat.index == 0} ? 'display:block;' : 'display:none;'">

                        <p class="quiz-question"
                           th:text="|${quizStat.count}. ${quiz.questionText}|">
                            1. 문제 내용
                        </p>

                        <div class="quiz-options">
                            <button type="button"
                                    class="quiz-option"
                                    th:each="choice : ${quiz.choices}"
                                    th:data-quiz-id="${quiz.quizId}"
                                    th:data-choice-id="${choice.choiceId}"
                                    th:data-answer="${choice.correctYn}"
                                    th:classappend="${duCompleted == true and choice.correctYn == 'Y'} ? ' correct' : ''"
                                    th:disabled="${duCompleted == true}"
                                    th:text="${choice.choiceText}">
                                보기 내용
                            </button>
                        </div>

                        <!-- 전체 이수 완료 후에는 해설 표시 -->
                        <p class="quiz-explanation"
                           th:if="${duCompleted == true and quiz.explanation != null}"
                           th:text="${quiz.explanation}">
                            해설 내용
                        </p>
                    </div>

                    <!-- 메시지 -->
                    <p id="quizMessage"
                       class="quiz-message"
                       th:text="${duCompleted == true} ? '교통안전교육을 모두 이수했습니다.' : ''">
                    </p>

                    <!-- 문제 이동 / 제출 버튼 -->
                    <div class="quiz-nav"
                         th:if="${quizzes != null and !quizzes.isEmpty()}">

                        <button type="button"
                                id="prevQuizBtn"
                                class="outline-btn">
                            이전 문제
                        </button>

                        <button type="button"
                                id="nextQuizBtn"
                                class="outline-btn">
                            다음 문제
                        </button>
                        <button type="button"
                                id="submitQuizBtn"
                                class="primary-btn"
                                style="display:none;"
                                th:if="${duCompleted != true}"
                                disabled>
                            퀴즈 제출
                        </button>
                    </div>

                    <!-- 챕터 이동 / 다시보기 / 필기 원서접수 -->
                    <div class="chapter-action-box">

                        <a id="nextChapterBtn"
                           class="outline-btn disabled"
                           th:if="${duCompleted != true and nextChapter != null}"
                           th:href="@{/drive-u/du/{chapterId}(chapterId=${nextChapter.chapterId})}">
                            다음 챕터로 이동
                        </a>

                        <button type="button"
                                id="retryBtn"
                                class="outline-btn disabled"
                                th:if="${duCompleted != true}">
                            이 챕터 다시보기
                        </button>

                        <a class="primary-btn"
                           th:if="${duCompleted == true}"
                           th:href="@{/drive-u/process}">
                            다음 단계 확인하기
                        </a>
                    </div>
                </div>

            </div>
        </section>
    </main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script src="https://www.youtube.com/iframe_api"></script>
<script th:src="@{/js/du.js}"></script>
</body>
</html>
