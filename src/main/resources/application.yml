spring:
  application:
    name: driveu
  profiles:
    active: local

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      location: C:\\upload
      max-request-size: 30MB
      max-file-size: 10MB

  # DB정보넣으면 주석풀기
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8081

logging:
  level:
    org:
      springframework: info
    com:
      zerock: debug